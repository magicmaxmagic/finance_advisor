# finlab proof-of-concept universe.
#
# A fixed list of large-cap US filers spanning 11 GICS-like sectors, so that
# peer comparison and sector-neutral ranking are meaningful on a small sample.
# Hand-maintained: this is deliberately NOT derived from a scraped ticker list.
#
# CIKs were resolved once against the SEC's official company_tickers.json and
# are pinned here. CIK is the durable key -- tickers change, and at least one
# entry proves it: Exxon Mobil files under 2115436, the holding company created
# in its 2024 reorganisation, not the 34088 most references still cite.
#
# `sector` is our own GICS-like label. The SEC publishes SIC codes, not GICS,
# and companyfacts carries neither, so this column is the only sector source
# the PoC has.

