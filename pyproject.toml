[project]
name = "finlab"
version = "0.1.0"
description = "Self-hosted financial research platform: SEC filings, deterministic valuation, verified reports."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    # warehouse
    "duckdb>=1.1,<2",
    "polars>=1.0",
    # Capped below 25: pyarrow 25.0.0 segfaults converting a pandas DataFrame to
    # Arrow on Streamlit's script thread, which kills the UI on the second
    # rerun (any slider move). Reproducible with a five-line Streamlit app and
    # no finlab code at all; 24.0.0 and 21.0.0 are clean. Re-test before lifting.
    "pyarrow>=16.0,<25",
    # http / retry
    "httpx>=0.27",
    "tenacity>=8.2",
    "selectolax>=0.3.21",
    # config / validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # orchestration
    "apscheduler>=3.10,<4",
    "structlog>=24.1",
    # numerics
    "numpy>=1.26",
    "python-dateutil>=2.8",
    "scipy>=1.13",
    # cli
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "yfinance>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# LLM agent layer — M5 onward.
text = ["pydantic-ai>=0.0.14"]
# Extraction evals — M5 onward. Pulls a large transitive tree.
eval = ["mlflow>=2.14"]
# Backtest statistics and tearsheets — M7 onward.
research = ["statsmodels>=0.14", "quantstats>=0.0.62"]
# Read-only UI.
ui = ["streamlit>=1.36"]

[project.scripts]
finlab = "finlab.cli:app"
finlabd = "finlab.daemon.main:main"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finlab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "TID",  # tidy imports
    "PTH",  # use pathlib
    "RUF",
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# SIM117: `pytest.raises` wrapping a context manager reads better nested.
"tests/*" = ["B011", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that hit the network or take more than a few seconds",
]

[tool.uv]
default-groups = ["dev"]
